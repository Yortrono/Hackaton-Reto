services:
  borde-proxy:
    build:
      context: ./borde-proxy
      dockerfile: Dockerfile
    container_name: borde-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-8088}:80"
      - "${PROXY_HTTPS_PORT:-8443}:443"
    networks:
      - perimetral
      - soberana_interna
    depends_on:
      - backend-nucleo
      - demo-institucional

  # Backend Núcleo Soberano (Dev 1)
  backend-nucleo:
    build:
      context: ./backend-nucleo
      dockerfile: Dockerfile
    container_name: backend-nucleo
    restart: unless-stopped
    environment:
      - IA_SERVICE_URL=http://ia-conductual:8001
      - DATABASE_PATH=/app/data/backend_nucleo.db
      - VAULT_MASTER_KEY=b2ade4ac9b2f32644150e2e35a7177a2b7ff35449618c2d4320b10006d4eb69b
    expose:
      - "8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - perimetral
      - soberana_interna
    depends_on:
      - ia-conductual

  # Microservicio Local de Inferencia Conductual ONNX (Dev 2)
  ia-conductual:
    build:
      context: ./ia-conductual
      dockerfile: Dockerfile
    container_name: ia-conductual
    restart: unless-stopped
    ports:
      - "${IA_PORT:-8001}:8001"
    expose:
      - "8001"
    networks:
      - soberana_interna

  # Demo Institucional - Portal Ciudadano de Trámites (Dev 2)
  demo-institucional:
    build:
      context: ./demo-institucional
      dockerfile: Dockerfile
    container_name: demo-institucional
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - soberana_interna
    depends_on:
      - ia-conductual

  # Consola Administrativa y de Observabilidad Web (Dev 3)
  consola-admin:
    build:
      context: ./consola-admin
      dockerfile: Dockerfile
    container_name: consola-admin
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend-nucleo:8000
      - IA_URL=http://ia-conductual:8001
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    expose:
      - "3000"
    networks:
      - perimetral
      - soberana_interna
    depends_on:
      - backend-nucleo

networks:
  perimetral:
    driver: bridge
  soberana_interna:
    driver: bridge
    internal: true
