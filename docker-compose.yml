services:
  borde-proxy:
    build:
      context: ./borde-proxy
      dockerfile: Dockerfile
    container_name: borde-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-8088}:80"
      - "${PROXY_HTTPS_PORT:-8443}:443"
    networks:
      - perimetral
      - soberana_interna
    depends_on:
      - demo-institucional

  demo-institucional:
    build:
      context: ./demo-institucional
      dockerfile: Dockerfile
    container_name: demo-institucional
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - soberana_interna
    depends_on:
      - ia-conductual

  # Microservicio Local de Inferencia Conductual ONNX (Dev 2)
  ia-conductual:
    build:
      context: ./ia-conductual
      dockerfile: Dockerfile
    container_name: ia-conductual
    restart: unless-stopped
    ports:
      - "${IA_PORT:-8001}:8001"
    expose:
      - "8001"
    networks:
      - soberana_interna

  # Consola Administrativa y de Observabilidad Web (Dev 3)
  consola-admin:
    build:
      context: ./consola-admin
      dockerfile: Dockerfile
    container_name: consola-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    expose:
      - "3000"
    networks:
      - perimetral
      - soberana_interna

  # Backend Núcleo (Dev 1 / Placeholder soberano)
  backend-nucleo:
    container_name: backend-nucleo
    image: python:3.11-slim
    command: ["python", "-m", "http.server", "8000"]
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - soberana_interna

networks:
  perimetral:
    driver: bridge
  soberana_interna:
    driver: bridge
    internal: true
