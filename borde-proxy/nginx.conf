worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log warn;
pid /var/run/openresty.pid;

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Ocultar versión de servidor por seguridad perimetral
    server_tokens off;

    # Configuración de Lua y Memoria Compartida
    lua_package_path "/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/nginx/lua/?.lua;;";
    lua_shared_dict policies_cache 10m;
    lua_shared_dict rate_limit_store 20m;

    # Sincronización dinámica de políticas en segundo plano desde backend-nucleo
    init_worker_by_lua_file /usr/local/openresty/nginx/lua/policy_sync.lua;

    # Resolver DNS interno de Podman/Docker
    resolver 10.89.1.1 10.89.0.1 ipv6=off valid=30s;

    # Servidor HTTP: Redirección obligatoria hacia HTTPS TLS 1.3
    server {
        listen 80;
        server_name localhost portal.gob.local;

        return 301 https://$host$request_uri;
    }

    # Servidor Seguro Perimetral TLS 1.3
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost portal.gob.local;

        # Terminación estricta TLS 1.3
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.3;
        ssl_prefer_server_ciphers off;

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Cabeceras de seguridad soberanas
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; connect-src 'self';" always;

        # Enrutamiento de desafío y verificación hacia Backend Núcleo oficial (Dev 1)
        location /api/v1/challenge/ {
            access_by_lua_file /usr/local/openresty/nginx/lua/edge_guard.lua;

            set $backend_cluster http://backend-nucleo:8000;
            proxy_pass $backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Rutas generales de API hacia Backend Núcleo (Dev 1)
        location /api/v1/ {
            access_by_lua_file /usr/local/openresty/nginx/lua/edge_guard.lua;

            set $backend_cluster http://backend-nucleo:8000;
            proxy_pass $backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Inspección perimetral de borde y proxy hacia la aplicación institucional (Demo Ciudadana)
        location / {
            access_by_lua_file /usr/local/openresty/nginx/lua/edge_guard.lua;

            proxy_pass http://demo-institucional:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
